<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pig Game</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="game">
      <section class="player player--0 player--active">
        <h2 class="name" id="name--0">Player 1</h2>
        <p class="score" id="score--0">0</p>

        <div class="current">
          <p class="current-label">Current</p>
          <p class="current-score" id="current--0">0</p>
        </div>
      </section>

      <section class="player player--1">
        <h2 class="name" id="name--1">Player 2</h2>
        <p class="score" id="score--1">0</p>

        <div class="current">
          <p class="current-label">Current</p>
          <p class="current-score" id="current--1">0</p>
        </div>
      </section>

      <div class="game-controls">
        <h1>PIG GAME</h1>

        <label for="target-score">Winning Score</label>
        <select id="target-score">
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="150">150</option>
          <option value="200">200</option>
        </select>

        <img src="dice-5.png" alt="Playing dice" class="dice hidden" />

        <button class="btn btn--new">🔄 New Game</button>
        <button class="btn btn--roll">🎲 Roll Dice</button>
        <button class="btn btn--hold">📥 Hold</button>

        <button class="btn btn--sound">🔊 Sound On</button>

        <div class="history">
          <h3>Last 5 Rolls</h3>
          <ul id="roll-history">
            <li>No rolls yet</li>
          </ul>
        </div>

        <p class="message" id="message">Player 1's turn!</p>
      </div>
    </main>
  </body>
</html>
